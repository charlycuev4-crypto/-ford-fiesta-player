<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Fiesta Multimedia Fullscreen Toggle</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body, html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background-color: #000;
        }

        /* Pantalla multimedia de fondo */
        .media-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            background-color: #000;
        }

        .media-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Interfaz flotante */
        .overlay-ui {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 15px 20px 15px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        .overlay-ui * {
            pointer-events: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #eee;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speedometer {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 15px;
        }

        /* Botón de Pantalla Completa */
        .fs-btn {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .fs-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .upload-section {
            display: flex;
            justify-content: center;
        }

        .file-btn {
            background-color: rgba(0, 210, 255, 0.9);
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .footer-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .song-info {
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .song-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 2px 0;
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 12px;
            color: #ccc;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button.control-btn {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        button.control-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        button.play-btn {
            width: 55px;
            height: 55px;
            background-color: var(--accent-color);
            color: #000;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- Video en pantalla completa -->
        <div class="media-screen" id="mediaScreen">
            <video id="mediaVideo" playsinline></video>
        </div>

        <!-- Interfaz flotante -->
        <div class="overlay-ui">
            <div class="header">
                <div class="upload-section">
                    <label class="file-btn">
                        📂 Cargar Videos
                        <input type="file" id="localFileInput" accept="video/*" multiple style="display: none;">
                    </label>
                </div>
                
                <div class="header-right">
                    <div class="speedometer">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v4M4.93 10.93l2.83 2.83M2 18h4M18 18h4M16.24 13.76l2.83-2.83M12 12v6"/>
                            <circle cx="12" cy="14" r="8"/>
                        </svg>
                        <span>KM/H</span>
                    </div>
                    <!-- Botón para alternar Pantalla Completa -->
                    <button class="fs-btn" id="fsToggleBtn" onclick="toggleFullScreen()" title="Pantalla Completa">⛶</button>
                </div>
            </div>

            <div class="footer-info">
                <div class="song-info">
                    <h2 id="title" class="song-title">Cargá tus videos</h2>
                    <p id="artist" class="song-artist">Reproducción Automática</p>
                </div>

                <div class="controls">
                    <button class="control-btn" onclick="prevMedia()">⏮</button>
                    <button id="playPauseBtn" class="play-btn control-btn" onclick="togglePlay()">▶</button>
                    <button class="control-btn" onclick="nextMedia()">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mediaVideo = document.getElementById('mediaVideo');
        const localFileInput = document.getElementById('localFileInput');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playerContainer = document.getElementById('playerContainer');
        const fsToggleBtn = document.getElementById('fsToggleBtn');

        let playlist = [];
        let currentIndex = 0;

        // Función para entrar y salir de Pantalla Completa
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    console.log("Error al intentar pantalla completa:", err);
                });
                fsToggleBtn.textContent = "🗗"; // Icono de salir
            } else {
                document.exitFullscreen();
                fsToggleBtn.textContent = "⛶"; // Icono de entrar
            }
        }

        localFileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length > 0) {
                playlist = Array.from(files);
                currentIndex = 0;
                playCurrentMedia();
            }
        });

        function playCurrentMedia() {
            if (playlist.length === 0) return;
            const file = playlist[currentIndex];
            const fileURL = URL.createObjectURL(file);
            
            mediaVideo.src = fileURL;
            titleEl.textContent = file.name;
            artistEl.textContent = `Video ${currentIndex + 1} de ${playlist.length}`;
            
            mediaVideo.play().catch(e => console.log("Error al reproducir:", e));
            playPauseBtn.textContent = "⏸";
        }

        mediaVideo.addEventListener('ended', function() {
            if (playlist.length > 0) {
                currentIndex = (currentIndex + 1) % playlist.length;
                playCurrentMedia();
            }
        });

        function togglePlay() {
            if (!mediaVideo.src) return;

            if (mediaVideo.paused) {
                mediaVideo.play();
                playPauseBtn.textContent = "⏸";
            } else {
                mediaVideo.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        function nextMedia() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            playCurrentMedia();
        }

        function prevMedia() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playCurrentMedia();
        }
    </script>
</body>
</html>
