<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Fiesta Multimedia Local</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .player-container {
            background-color: var(--card-bg);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            border: none;
            border-radius: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #aaa;
            padding: 5px 10px;
        }

        .speedometer {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 18px;
        }

        /* Botón para cargar video del celu */
        .upload-section {
            display: flex;
            justify-content: center;
            padding: 5px;
        }

        .file-btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,210,255,0.3);
        }

        /* Pantalla multimedia a Pantalla Completa */
        .media-screen {
            width: 100%;
            flex-grow: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 5px 0;
        }

        .media-screen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .song-info {
            margin-bottom: 5px;
            text-align: center;
        }

        .song-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 13px;
            color: #888;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding-bottom: 10px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        button.play-btn {
            width: 65px;
            height: 65px;
            background-color: var(--accent-color);
            color: #000;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Cabecera con Velocímetro y botón para elegir video local -->
        <div class="header">
            <span>FORD FIESTA</span>
            <div class="upload-section">
                <label class="file-btn">
                    📂 Cargar Video
                    <input type="file" id="localFileInput" accept="video/*" style="display: none;">
                </label>
            </div>
            <div class="speedometer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M4.93 10.93l2.83 2.83M2 18h4M18 18h4M16.24 13.76l2.83-2.83M12 12v6"/>
                    <circle cx="12" cy="14" r="8"/>
                </svg>
                <span>KM/H</span>
            </div>
        </div>

        <!-- Pantalla Multimedia -->
        <div class="media-screen" id="mediaScreen">
            <video id="mediaVideo" playsinline controls></video>
        </div>

        <!-- Información de la pista -->
        <div class="song-info">
            <h2 id="title" class="song-title">Seleccioná un video</h2>
            <p id="artist" class="song-artist">Almacenamiento Local</p>
        </div>

        <!-- Controles de Reproducción -->
        <div class="controls">
            <button onclick="rewindMedia()">⏪</button>
            <button id="playPauseBtn" class="play-btn" onclick="togglePlay()">▶</button>
            <button onclick="forwardMedia()">⏩</button>
        </div>
    </div>

    <script>
        const mediaVideo = document.getElementById('mediaVideo');
        const localFileInput = document.getElementById('localFileInput');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const playPauseBtn = document.getElementById('playPauseBtn');

        // Manejar la selección del archivo de video desde el celular
        localFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                mediaVideo.src = fileURL;
                titleEl.textContent = file.name;
                artistEl.textContent = "Reproduciendo local";
                mediaVideo.play();
                playPauseBtn.textContent = "⏸";
            }
        });

        function togglePlay() {
            if (!mediaVideo.src) return;

            if (mediaVideo.paused) {
                mediaVideo.play();
                playPauseBtn.textContent = "⏸";
            } else {
                mediaVideo.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        function rewindMedia() {
            mediaVideo.currentTime -= 5;
        }

        function forwardMedia() {
            mediaVideo.currentTime += 5;
        }
    </script>
</body>
</html>
