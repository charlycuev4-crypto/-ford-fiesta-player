<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Fiesta Multimedia Player</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .player-container {
            background-color: var(--card-bg);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            border: none;
            border-radius: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #aaa;
            padding: 5px 10px;
        }

        .speedometer {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 18px;
        }

        /* Pantalla multimedia en Pantalla Completa */
        .media-screen {
            width: 100%;
            flex-grow: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 10px 0;
        }

        .media-screen img, .media-screen video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción del video sin cortarlo */
        }

        .song-info {
            margin-bottom: 10px;
            text-align: center;
        }

        .song-title {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .song-artist {
            font-size: 14px;
            color: #888;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding-bottom: 15px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        button.play-btn {
            width: 70px;
            height: 70px;
            background-color: var(--accent-color);
            color: #000;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Cabecera con Velocímetro -->
        <div class="header">
            <span>FORD FIESTA MULTIMEDIA</span>
            <div class="speedometer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M4.93 10.93l2.83 2.83M2 18h4M18 18h4M16.24 13.76l2.83-2.83M12 12v6"/>
                    <circle cx="12" cy="14" r="8"/>
                </svg>
                <span>KM/H</span>
            </div>
        </div>

        <!-- Pantalla Multimedia a Pantalla Completa -->
        <div class="media-screen" id="mediaScreen">
            <img id="mediaImage" src="" alt="Ford Fiesta" style="display: none;">
            <video id="mediaVideo" style="display: none;" playsinline autoplay controls></video>
        </div>

        <!-- Información de la pista -->
        <div class="song-info">
            <h2 id="title" class="song-title">Cargando...</h2>
            <p id="artist" class="song-artist">Ford Media</p>
        </div>

        <!-- Controles de Reproducción -->
        <div class="controls">
            <button onclick="prevMedia()">⏮</button>
            <button id="playPauseBtn" class="play-btn" onclick="togglePlay()">⏸</button>
            <button onclick="nextMedia()">⏭</button>
        </div>
    </div>

    <script>
        // Lista con tu video ya subido a GitHub
        const playlist = [
            {
                type: "video", 
                title: "Video Ford Fiesta",
                artist: "Modo Pantalla Completa",
                src: "7fc413ec7c87048c112c77b65101a58a_1791864253341.mp4" 
            }
        ];

        let currentIndex = 0;
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const mediaImage = document.getElementById('mediaImage');
        const mediaVideo = document.getElementById('mediaVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');

        let activePlayer = null;

        function loadMedia(index) {
            const item = playlist[index];
            titleEl.textContent = item.title;
            artistEl.textContent = item.artist;

            if (activePlayer && activePlayer.tagName === 'VIDEO') {
                activePlayer.pause();
            }

            if (item.type === "video") {
                mediaImage.style.display = "none";
                mediaVideo.style.display = "block";
                mediaVideo.src = item.src;
                activePlayer = mediaVideo;
                activePlayer.play().catch(e => console.log("Autoplay bloqueado:", e));
            }
        }

        function togglePlay() {
            if (!activePlayer) return;

            if (activePlayer.paused) {
                activePlayer.play();
                playPauseBtn.textContent = "⏸";
            } else {
                activePlayer.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        function nextMedia() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadMedia(currentIndex);
        }

        function prevMedia() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadMedia(currentIndex);
        }

        // Inicializar el reproductor
        loadMedia(currentIndex);
    </script>
</body>
</html>
