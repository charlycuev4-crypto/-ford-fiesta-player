<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Fiesta Multimedia Total</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
        }

        body, html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background-color: #000;
        }

        /* Pantalla multimedia que llena absolutamente toda la pantalla */
        .media-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            background-color: #000;
        }

        .media-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Pantalla totalmente completa y gigante */
        }

        /* Capa superior para los botones y textos flotantes */
        .overlay-ui {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }

        .overlay-ui * {
            pointer-events: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #eee;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .speedometer {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 16px;
        }

        .upload-section {
            display: flex;
            justify-content: center;
        }

        .file-btn {
            background-color: rgba(0, 210, 255, 0.9);
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .footer-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .song-info {
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 2px 0;
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 12px;
            color: #ccc;
            margin: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding-bottom: 5px;
        }

        button {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        button.play-btn {
            width: 55px;
            height: 55px;
            background-color: var(--accent-color);
            color: #000;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Video de fondo en pantalla completa real -->
        <div class="media-screen" id="mediaScreen">
            <video id="mediaVideo" playsinline autoplay loop></video>
        </div>

        <!-- Interfaz flotante -->
        <div class="overlay-ui">
            <div class="header">
                <span>FORD FIESTA</span>
                <div class="upload-section">
                    <label class="file-btn">
                        📂 Cargar Video
                        <input type="file" id="localFileInput" accept="video/*" style="display: none;">
                    </label>
                </div>
                <div class="speedometer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v4M4.93 10.93l2.83 2.83M2 18h4M18 18h4M16.24 13.76l2.83-2.83M12 12v6"/>
                        <circle cx="12" cy="14" r="8"/>
                    </svg>
                    <span>KM/H</span>
                </div>
            </div>

            <div class="footer-info">
                <div class="song-info">
                    <h2 id="title" class="song-title">Seleccioná un video</h2>
                    <p id="artist" class="song-artist">Pantalla Completa</p>
                </div>

                <div class="controls">
                    <button onclick="rewindMedia()">⏪</button>
                    <button id="playPauseBtn" class="play-btn" onclick="togglePlay()">⏸</button>
                    <button onclick="forwardMedia()">⏩</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mediaVideo = document.getElementById('mediaVideo');
        const localFileInput = document.getElementById('localFileInput');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const playPauseBtn = document.getElementById('playPauseBtn');

        localFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                mediaVideo.src = fileURL;
                titleEl.textContent = file.name;
                artistEl.textContent = "Reproduciendo local";
                mediaVideo.play().catch(e => console.log("Error al reproducir:", e));
                playPauseBtn.textContent = "⏸";
            }
        });

        function togglePlay() {
            if (!mediaVideo.src) return;

            if (mediaVideo.paused) {
                mediaVideo.play();
                playPauseBtn.textContent = "⏸";
            } else {
                mediaVideo.pause();
                playPauseBtn.textContent = "▶";
            }
        }

        function rewindMedia() {
            mediaVideo.currentTime -= 5;
        }

        function forwardMedia() {
            mediaVideo.currentTime += 5;
        }
    </script>
</body>
</html>
